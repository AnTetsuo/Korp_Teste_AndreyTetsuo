services:
  stock-db:
    image: postgres:18-alpine
    container_name: stock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing POSTGRES_DB - copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?missing POSTGRES_USER - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD - copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stock-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  stock-api:
    build:
      context: ./stock
      dockerfile: Dockerfile
    container_name: stock-api
    restart: unless-stopped
    depends_on:
      stock-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ApiDocs__Enabled: ${API_DOCS_ENABLED:-false}
      ConnectionStrings__Default: Host=stock-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT:-3000}:8080"

volumes:
  stock-pgdata:
